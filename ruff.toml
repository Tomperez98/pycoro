line-length = 100

[lint]
ignore = [
    "A001",
    "A002",
    "ANN401",
    "ARG002",
    "BLE001",
    "C901",
    "COM812",
    "D",
    "INP001",
    "PLR0912",
    "S101",
    "S311",
]
select = ["ALL"]

[lint.isort]
combine-as-imports = true
required-imports = ["from __future__ import annotations"]
